id = "gegnep/niri-taskbar"
name = "Niri Taskbar"
version = "0.1.0"
min_noctalia = "5.0.0"
author = "pengeg"
license = "MIT"
icon = "layout-grid"
description = "Combined niri workspace/taskbar widget: workspace chips that expand on hover to show each workspace's windows."
tags = ["niri", "workspaces", "taskbar"]
dependencies = []

[[widget]]
id = "taskbar"
entry = "taskbar.luau"

  [[widget.setting]]
  key = "focused_output_only"
  type = "bool"
  label = "Focused monitor only"
  description = "Show only the focused monitor's workspaces instead of this monitor's."
  default = false

  [[widget.setting]]
  key = "show_empty_workspaces"
  type = "bool"
  label = "Show empty workspaces"
  description = "Show chips for workspaces with no windows. The active workspace is always shown."
  default = true

  [[widget.setting]]
  key = "display"
  type = "select"
  label = "Workspace label"
  description = "What each chip shows: the workspace index, its name (falls back to the index), or a bare pill."
  default = "id"
  options = [
    { value = "id", label = "Id" },
    { value = "name", label = "Name" },
    { value = "none", label = "None" },
  ]

  [[widget.setting]]
  key = "show_window_titles"
  type = "bool"
  label = "Show window titles"
  description = "Show a truncated window title next to each window tile. Always off in a vertical (side) bar."
  default = false

  [[widget.setting]]
  key = "max_windows_per_workspace"
  type = "int"
  label = "Max windows per workspace"
  description = "Cap on expanded window tiles per workspace before collapsing the rest into a +N label."
  default = 10
  min = 1
  max = 30
  step = 1

  [[widget.setting]]
  key = "labels_only_when_occupied"
  type = "bool"
  label = "Labels only when occupied"
  description = "Hide the label on empty, inactive workspace chips, leaving a bare pill."
  default = false

  [[widget.setting]]
  key = "max_label_chars"
  type = "int"
  label = "Max label characters"
  description = "Truncate workspace name labels to this many characters. Purely numeric labels are never truncated."
  default = 1
  min = 1
  max = 20
  step = 1

  [[widget.setting]]
  key = "only_active_workspace"
  type = "bool"
  label = "Only active workspace windows"
  description = "Show window tiles only for each monitor's active workspace. Other workspace chips still render."
  default = false

  [[widget.setting]]
  key = "icon_size"
  type = "int"
  label = "Icon size"
  description = "Window app icon size in pixels."
  default = 16
  min = 12
  max = 32
  step = 1

  [[widget.setting]]
  key = "chip_size"
  type = "int"
  label = "Chip size"
  description = "Workspace chip diameter."
  default = 16
  min = 12
  max = 24
  step = 1

  [[widget.setting]]
  key = "chip_style"
  type = "select"
  label = "Chip style"
  description = "Idle chip shape: a compact lying oval that rounds into a circle on expand, or always a circle."
  default = "oval"
  options = [
    { value = "oval", label = "Oval" },
    { value = "circle", label = "Circle" },
  ]

  [[widget.setting]]
  key = "chip_spacing"
  type = "int"
  label = "Chip spacing"
  description = "Spacing between workspaces."
  default = 3
  min = 0
  max = 12
  step = 1

  [[widget.setting]]
  key = "collapse_delay_ms"
  type = "int"
  label = "Collapse delay"
  description = "Hover linger before collapse, in milliseconds."
  default = 1250
  min = 250
  max = 5000
  step = 250

  [[widget.setting]]
  key = "expand_speed"
  type = "select"
  label = "Expand speed"
  description = "Expand animation speed."
  default = "normal"
  options = [
    { value = "fast", label = "Fast" },
    { value = "normal", label = "Normal" },
    { value = "slow", label = "Slow" },
  ]

  [[widget.setting]]
  key = "show_focus_dot"
  type = "bool"
  label = "Show focus dot"
  description = "Show a dot under the focused window's tile."
  default = true

  [[widget.setting]]
  key = "pill_tint"
  type = "int"
  label = "Pill tint"
  description = "Expanded pill tint strength (%)."
  default = 30
  min = 0
  max = 60
  step = 5
