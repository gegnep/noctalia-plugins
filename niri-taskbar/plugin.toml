id = "gegnep/niri-taskbar"
name = "Niri Taskbar"
version = "0.1.0"
min_noctalia = "5.0.0"
author = "pengeg"
license = "MIT"
icon = "layout-grid"
description = "Combined niri workspace/taskbar widget: workspace chips that expand on hover to show each workspace's windows."
tags = ["niri", "workspaces", "taskbar"]
dependencies = []

[[widget]]
id = "taskbar"
entry = "taskbar.luau"

  [[widget.setting]]
  key = "focused_output_only"
  type = "bool"
  label = "Focused monitor only"
  description = "Show only the focused monitor's workspaces instead of this monitor's."
  default = false

  [[widget.setting]]
  key = "show_empty_workspaces"
  type = "bool"
  label = "Show empty workspaces"
  description = "Show chips for workspaces with no windows. The active workspace is always shown."
  default = true

  [[widget.setting]]
  key = "display"
  type = "select"
  label = "Workspace label"
  description = "What each chip shows: the workspace index, its name (falls back to the index), or a bare pill."
  default = "id"
  options = [
    { value = "id", label = "Id" },
    { value = "name", label = "Name" },
    { value = "none", label = "None" },
  ]

  [[widget.setting]]
  key = "show_window_titles"
  type = "bool"
  label = "Show window titles"
  description = "Show a truncated window title next to each window tile. Always off in a vertical (side) bar."
  default = false

  [[widget.setting]]
  key = "max_windows_per_workspace"
  type = "int"
  label = "Max windows per workspace"
  description = "Cap on expanded window tiles per workspace before collapsing the rest into a +N label."
  default = 10
  min = 1
  max = 30
  step = 1

  [[widget.setting]]
  key = "labels_only_when_occupied"
  type = "bool"
  label = "Labels only when occupied"
  description = "Hide the label on empty, inactive workspace chips, leaving a bare pill."
  default = false

  [[widget.setting]]
  key = "max_label_chars"
  type = "int"
  label = "Max label characters"
  description = "Truncate workspace name labels to this many characters. Purely numeric labels are never truncated."
  default = 1
  min = 1
  max = 20
  step = 1

  [[widget.setting]]
  key = "only_active_workspace"
  type = "bool"
  label = "Only active workspace windows"
  description = "Show window tiles only for each monitor's active workspace. Other workspace chips still render."
  default = false

  [[widget.setting]]
  key = "icon_size"
  type = "int"
  label = "Icon size"
  description = "Window app icon size in pixels."
  default = 16
  min = 12
  max = 32
  step = 1

  [[widget.setting]]
  key = "icon_theme_override"
  type = "string"
  label = "Icon theme override"
  description = "Icon theme name to use instead of the desktop interface setting. Leave blank for automatic."
  default = ""
