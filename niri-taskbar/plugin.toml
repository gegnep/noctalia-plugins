id = "gegnep/niri-taskbar"
name = "Niri Taskbar"
version = "0.1.0"
min_noctalia = "5.0.0"
author = "pengeg"
license = "MIT"
icon = "layout-grid"
description = "Combined niri workspace/taskbar widget: workspace chips that expand on hover to show each workspace's windows."
tags = ["niri", "workspaces", "taskbar"]
dependencies = []

[[widget]]
id = "taskbar"
entry = "taskbar.luau"

  [[widget.setting]]
  key = "focused_output_only"
  type = "bool"
  label = "Focused monitor only"
  description = "Show only the focused monitor's workspaces instead of this monitor's."
  default = false

  [[widget.setting]]
  key = "show_empty_workspaces"
  type = "bool"
  label = "Show empty workspaces"
  description = "Show chips for workspaces with no windows. The active workspace is always shown."
  default = true

  [[widget.setting]]
  key = "display"
  type = "select"
  label = "Workspace label"
  description = "What each chip shows: the workspace index, its name (falls back to the index), or a bare pill."
  default = "id"
  options = [
    { value = "id", label = "Id" },
    { value = "name", label = "Name" },
    { value = "none", label = "None" },
  ]

  [[widget.setting]]
  key = "show_window_titles"
  type = "bool"
  label = "Show window titles"
  description = "Show a truncated window title next to each window tile. Always off in a vertical (side) bar."
  default = false

  [[widget.setting]]
  key = "max_windows_per_workspace"
  type = "int"
  label = "Max windows per workspace"
  description = "Cap on expanded window tiles per workspace before collapsing the rest into a +N label."
  default = 10
  min = 1
  max = 30
  step = 1
