id = "gegnep/niri-taskbar"
name = "Niri Taskbar"
version = "0.1.0"
plugin_api = 3
author = "pengeg"
license = "MIT"
icon = "layout-grid"
description = "Combined niri workspace/taskbar widget: workspace chips that expand on hover to show each workspace's windows."
tags = ["niri", "workspaces", "taskbar"]
dependencies = []

[[widget]]
id = "taskbar"
entry = "taskbar.luau"

  [[widget.setting]]
  key = "focused_output_only"
  type = "bool"
  label_key = "settings.focused_output_only.label"
  description_key = "settings.focused_output_only.description"
  default = false

  [[widget.setting]]
  key = "show_empty_workspaces"
  type = "bool"
  label_key = "settings.show_empty_workspaces.label"
  description_key = "settings.show_empty_workspaces.description"
  default = true

  [[widget.setting]]
  key = "display"
  type = "select"
  label_key = "settings.display.label"
  description_key = "settings.display.description"
  default = "id"
  options = [
    { value = "id", label_key = "settings.display.options.id" },
    { value = "name", label_key = "settings.display.options.name" },
    { value = "windows", label_key = "settings.display.options.windows" },
    { value = "none", label_key = "settings.display.options.none" },
  ]

  [[widget.setting]]
  key = "window_titles"
  type = "select"
  label_key = "settings.window_titles.label"
  description_key = "settings.window_titles.description"
  default = "off"
  options = [
    { value = "off", label_key = "settings.window_titles.options.off" },
    { value = "hover", label_key = "settings.window_titles.options.hover" },
    { value = "always", label_key = "settings.window_titles.options.always" },
  ]

  [[widget.setting]]
  key = "max_windows_per_workspace"
  type = "int"
  label_key = "settings.max_windows_per_workspace.label"
  description_key = "settings.max_windows_per_workspace.description"
  default = 10
  min = 1
  max = 30
  step = 1

  [[widget.setting]]
  key = "labels_only_when_occupied"
  type = "bool"
  label_key = "settings.labels_only_when_occupied.label"
  description_key = "settings.labels_only_when_occupied.description"
  default = false

  [[widget.setting]]
  key = "max_label_chars"
  type = "int"
  label_key = "settings.max_label_chars.label"
  description_key = "settings.max_label_chars.description"
  default = 1
  min = 1
  max = 20
  step = 1

  [[widget.setting]]
  key = "only_active_workspace"
  type = "bool"
  label_key = "settings.only_active_workspace.label"
  description_key = "settings.only_active_workspace.description"
  default = false

  [[widget.setting]]
  key = "icon_size"
  type = "int"
  label_key = "settings.icon_size.label"
  description_key = "settings.icon_size.description"
  default = 16
  min = 12
  max = 32
  step = 1

  [[widget.setting]]
  key = "chip_size"
  type = "int"
  label_key = "settings.chip_size.label"
  description_key = "settings.chip_size.description"
  default = 16
  min = 12
  max = 24
  step = 1

  [[widget.setting]]
  key = "chip_ratio"
  type = "int"
  label_key = "settings.chip_ratio.label"
  description_key = "settings.chip_ratio.description"
  default = 140
  min = 100
  max = 400
  step = 10

  [[widget.setting]]
  key = "chip_spacing"
  type = "int"
  label_key = "settings.chip_spacing.label"
  description_key = "settings.chip_spacing.description"
  default = 3
  min = 0
  max = 12
  step = 1

  [[widget.setting]]
  key = "collapse_delay_ms"
  type = "int"
  label_key = "settings.collapse_delay_ms.label"
  description_key = "settings.collapse_delay_ms.description"
  default = 1250
  min = 250
  max = 5000
  step = 250

  [[widget.setting]]
  key = "expand_speed"
  type = "select"
  label_key = "settings.expand_speed.label"
  description_key = "settings.expand_speed.description"
  default = "normal"
  options = [
    { value = "fast", label_key = "settings.expand_speed.options.fast" },
    { value = "normal", label_key = "settings.expand_speed.options.normal" },
    { value = "slow", label_key = "settings.expand_speed.options.slow" },
  ]

  [[widget.setting]]
  key = "show_focus_dot"
  type = "bool"
  label_key = "settings.show_focus_dot.label"
  description_key = "settings.show_focus_dot.description"
  default = true

  [[widget.setting]]
  key = "pill_tint"
  type = "int"
  label_key = "settings.pill_tint.label"
  description_key = "settings.pill_tint.description"
  default = 30
  min = 0
  max = 60
  step = 5
