id = "gegnep/claude-launcher"
name = "Claude Launcher"
version = "0.2.0"
plugin_api = 27
author = "pengeg"
license = "MIT"
icon = "asterisk"
description = "Thin prompt launcher for Claude: runs the first turn through the Claude Code CLI, then opens the session in Claude Desktop. Not affiliated with Anthropic."
tags = ["chat", "ai", "claude", "assistant"]
dependencies = []

[[panel]]
id = "chat"
entry = "panel.luau"
width = 640
height = 66
placement = "floating"
position = "center"
open_near_click = true
keyboard_focus = "exclusive"

[[setting]]
key = "claude_command"
type = "string"
label_key = "settings.claude_command.label"
description_key = "settings.claude_command.description"
default = "claude"

[[setting]]
key = "folder"
type = "folder"
label_key = "settings.folder.label"
description_key = "settings.folder.description"
default = ""

[[setting]]
key = "model"
type = "select"
label_key = "settings.model.label"
description_key = "settings.model.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.model.options.auto" },
  { value = "claude-fable-5-1", label_key = "settings.model.options.fable51" },
  { value = "claude-opus-5-5", label_key = "settings.model.options.opus55" },
  { value = "claude-sonnet-5-5", label_key = "settings.model.options.sonnet55" },
  { value = "claude-haiku-5-5", label_key = "settings.model.options.haiku55" },
]

[[setting]]
key = "models"
type = "string_list"
label_key = "settings.models.label"
description_key = "settings.models.description"
default = ["claude-fable-5-1", "claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]

[[setting]]
key = "effort"
type = "select"
label_key = "settings.effort.label"
description_key = "settings.effort.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.effort.options.auto" },
  { value = "low", label_key = "settings.effort.options.low" },
  { value = "medium", label_key = "settings.effort.options.medium" },
  { value = "high", label_key = "settings.effort.options.high" },
  { value = "xhigh", label_key = "settings.effort.options.xhigh" },
  { value = "max", label_key = "settings.effort.options.max" },
]

[[setting]]
key = "allow_tools"
type = "bool"
label_key = "settings.allow_tools.label"
description_key = "settings.allow_tools.description"
default = true
