id = "gegnep/claude-launcher"
name = "Claude Launcher"
version = "0.1.0"
plugin_api = 21
author = "pengeg"
license = "MIT"
icon = "asterisk"
description = "Streaming chat panel for Claude, backed by the Claude Code CLI (subscription auth). Not affiliated with Anthropic."
tags = ["chat", "ai", "claude", "assistant"]
dependencies = []

[[panel]]
id = "chat"
entry = "panel.luau"
width = 420
height = 560
placement = "floating"
position = "center"
open_near_click = true

[[setting]]
key = "claude_command"
type = "string"
label_key = "settings.claude_command.label"
description_key = "settings.claude_command.description"
default = "claude"

[[setting]]
key = "transcripts_dir"
type = "folder"
label_key = "settings.transcripts_dir.label"
description_key = "settings.transcripts_dir.description"
default = ""

[[setting]]
key = "model"
type = "select"
label_key = "settings.model.label"
description_key = "settings.model.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.model.options.auto" },
  { value = "claude-sonnet-5", label_key = "settings.model.options.sonnet" },
  { value = "claude-opus-5", label_key = "settings.model.options.opus" },
  { value = "haiku", label_key = "settings.model.options.haiku" },
  { value = "claude-fable-5", label_key = "settings.model.options.fable" },
]

[[setting]]
key = "models"
type = "string_list"
label_key = "settings.models.label"
description_key = "settings.models.description"
default = ["claude-sonnet-5", "claude-opus-5", "haiku", "claude-fable-5"]

[[setting]]
key = "effort"
type = "select"
label_key = "settings.effort.label"
description_key = "settings.effort.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.effort.options.auto" },
  { value = "low", label_key = "settings.effort.options.low" },
  { value = "medium", label_key = "settings.effort.options.medium" },
  { value = "high", label_key = "settings.effort.options.high" },
  { value = "xhigh", label_key = "settings.effort.options.xhigh" },
  { value = "max", label_key = "settings.effort.options.max" },
]

[[setting]]
key = "allow_tools"
type = "bool"
label_key = "settings.allow_tools.label"
description_key = "settings.allow_tools.description"
default = false
