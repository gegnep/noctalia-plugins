id = "gegnep/claude-launcher"
name = "Claude Launcher"
version = "0.1.0"
min_noctalia = "5.0.0"
author = "pengeg"
license = "MIT"
icon = "asterisk"
description = "Streaming chat panel for Claude, backed by the Claude Code CLI (subscription auth). Not affiliated with Anthropic."
tags = ["chat", "ai", "claude", "assistant"]
dependencies = []

[[panel]]
id = "chat"
entry = "panel.luau"
width = 420
height = 560
placement = "floating"
position = "center"
open_near_click = true

[[setting]]
key = "claude_command"
type = "string"
label = "Claude command"
description = "Path or name of the claude binary (point at a wrapper to sandbox it)"
default = "claude"

[[setting]]
key = "transcripts_dir"
type = "folder"
label = "Transcripts directory"
description = "Claude projects dir used to reload past conversations; empty auto-derives from the workspace path (sandboxed claude wrappers must set this explicitly)"
default = ""

[[setting]]
key = "model"
type = "select"
label = "Default model"
description = "Model new chats start with; custom aliases from the Models list are pickable per-chat but only via 'First in list' here"
default = "auto"
options = [
  { value = "auto", label = "First in list" },
  { value = "sonnet", label = "Sonnet" },
  { value = "opus", label = "Opus" },
  { value = "haiku", label = "Haiku" },
  { value = "fable", label = "Fable" },
]

[[setting]]
key = "models"
type = "string_list"
label = "Models"
description = "Model aliases offered by the in-panel switcher"
default = ["sonnet", "opus", "haiku", "fable"]

[[setting]]
key = "effort"
type = "select"
label = "Effort"
description = "Default reasoning level for new chats"
default = "auto"
options = [
  { value = "auto", label = "Default (High)" },
  { value = "low", label = "Low" },
  { value = "medium", label = "Medium" },
  { value = "high", label = "High" },
  { value = "xhigh", label = "X-High" },
  { value = "max", label = "Max" },
]

[[setting]]
key = "allow_tools"
type = "bool"
label = "Allow tools"
description = "Off (default): claude runs with all tools disabled. On: claude's default tool behavior."
default = false
