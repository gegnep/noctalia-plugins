name: Update Plugin Catalog

on:
  push:
    branches:
      - main
    paths:
      - "*/plugin.toml"
      - "tools/update-catalog.py"
  workflow_dispatch:

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild catalog
        run: python3 tools/update-catalog.py

      - name: Check for catalog changes
        id: catalog-diff
        run: |
          if git diff --quiet -- catalog.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit catalog
        if: steps.catalog-diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.toml
          git commit -m "chore: regenerate catalog.toml"
          git push
